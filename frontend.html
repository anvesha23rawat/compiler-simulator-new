<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Compiler Simulator</title>

  <style>
    * {
      background-color: #2c3e50;
      color: #ecf0f1;
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #34495e;
    }

    #left, #right {
      width: 50%;
      padding: 20px;
    }

    h2 {
      margin-top: 0;
      border-bottom: 2px solid #2980b9;
      padding-bottom: 5px;
    }

    textarea {
      width: 100%;
      height: 70%;
      padding: 15px;
      border: 1.5px solid #2980b9;
      border-radius: 10px;
      font-family: monospace;
      font-size: 15px;
      background-color: #1a252f;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      margin-right: 10px;
      padding: 10px 20px;
      background-color: #2980b9;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1c5980;
    }

    pre {
      background: #ecf0f1;
      color: #2c3e50;
      padding: 20px;
      height: 70%;
      overflow-y: auto;
      white-space: pre-wrap;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <!-- LEFT SIDE -->
  <div id="left">
    <h2>Input Code</h2>

    <textarea id="codeInput">
int a;
a = 5 + 3;
    </textarea>

    <br>

    <button onclick="processCode('tokenize')">Tokenize</button>
    <button onclick="processCode('parse')">Parse</button>
    <button onclick="processCode('semantic')">Semantic</button>
    <button onclick="runAll()">Run All</button>
  </div>

  <!-- RIGHT SIDE -->
  <div id="right">
    <h2 id="outputTitle">Output</h2>
    <pre id="outputArea"></pre>
  </div>

  <script>
    function processCode(action) {
      const code = document.getElementById("codeInput").value;

      const titleMap = {
        tokenize: "Tokens",
        parse: "Parse Tree",
        semantic: "Semantic Analysis"
      };

      document.getElementById("outputTitle").textContent = titleMap[action];

      fetch("http://localhost:3000/" + action, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ code })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("outputArea").textContent =
          data.result || data.tokens;
      })
      .catch(err => {
        document.getElementById("outputArea").textContent =
          "Error connecting to server";
      });
    }

    // 🔥 RUN ALL (combined output)
    function runAll() {
      const code = document.getElementById("codeInput").value;

      document.getElementById("outputTitle").textContent = "Full Output";

      Promise.all([
        fetch("http://localhost:3000/tokenize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        }).then(res => res.json()),

        fetch("http://localhost:3000/parse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        }).then(res => res.json()),

        fetch("http://localhost:3000/semantic", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        }).then(res => res.json())
      ])
      .then(([tokens, parse, semantic]) => {
        let output = "";

        output += "===== TOKENS =====\n";
        output += tokens.tokens || tokens.result;

        output += "\n\n===== PARSE TREE =====\n";
        output += parse.result;

        output += "\n\n===== SEMANTIC =====\n";
        output += semantic.result;

        document.getElementById("outputArea").textContent = output;
      });
    }
  </script>

</body>
</html>
